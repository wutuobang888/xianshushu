<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 - 闲书书</title>
  <link rel="stylesheet" href="{{ url_for('static',filename='vendor/bootstrap.min.css') }}">
  <style>body{background:#f4f6f8;color:#172a25;min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;font-family:system-ui,sans-serif}.login{width:100%;max-width:390px;background:white;border:1px solid #dde5e0;border-radius:14px;padding:32px}h1{font-size:28px;font-weight:700;margin-bottom:8px}.subtitle{color:#66766e;font-size:14px;margin-bottom:28px}label{font-size:14px;font-weight:600}.form-control{margin:8px 0 20px;padding:11px 12px}.btn{background:#19734f;color:white;border:0;width:100%;padding:11px}.btn:hover{background:#125d3f;color:white}.note{color:#748078;font-size:12px;line-height:1.7;margin:20px 0 0}</style>
</head>
<body><main class="login">
  <h1>闲书书</h1><p class="subtitle">登录你的图书管理工作台</p>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('web_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_path }}">
    <label for="username">网站账号</label>
    <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">网站密码</label>
    <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required>
    <button class="btn" type="submit">登录</button>
  </form>
  <p class="note">使用部署时设置的网站账号密码。孔夫子账号请在登录后的系统设置中填写。</p>
</main></body></html>
