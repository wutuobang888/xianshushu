{% extends "base.html" %}
{% block title %}打开货源 - 闲书书{% endblock %}
{% block content %}
<div class="card p-4 mx-auto" style="max-width:540px">
    <h5>正在同步收货地址…</h5>
    <p class="text-muted" id="source-message">核对成功后将直接打开孔夫子，请稍候。</p>
    <button id="source-retry" class="btn btn-outline-primary align-self-start" hidden>重新检查</button>
    <a href="{{ url_for('orders.index') }}" class="mt-3">返回订单</a>
    <p class="small text-muted mt-3 mb-0">孔夫子浏览器请登录与服务器相同的账号。购买前核对收货人；多人共用时，最后同步的地址会成为默认地址。</p>
</div>
{% endblock %}
{% block scripts %}
<script>
const message = document.getElementById('source-message');
const retry = document.getElementById('source-retry');
async function openSource() {
    retry.hidden = true;
    try {
        const response = await fetch({{ url_for('orders.sync_address', oid=order_id)|tojson }}, {method:'POST'});
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || '地址同步未成功，请返回订单重试');
        const url = new URL(result.source_url);
        if (url.protocol !== 'https:' || !['book.kongfz.com','search.kongfz.com','item.kongfz.com'].includes(url.hostname)) throw new Error('货源链接无效');
        location.replace(url.href);
    } catch (error) {
        document.querySelector('h5').textContent = '暂未打开货源';
        message.textContent = error.message || '连接失败，请返回订单重试';
        retry.hidden = false;
    }
}
retry.addEventListener('click',openSource);
openSource();
</script>
{% endblock %}
