<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>闲书书采购地址助手</title>
<style>body{width:310px;margin:20px;font:14px/1.7 system-ui;color:#202621}h1{font-size:19px;margin:0}p{margin:8px 0}label{display:block;margin-top:18px}input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #bbb;border-radius:4px}button{margin:10px 4px 0 0;padding:8px 12px;background:#17633d;color:white;border:0;border-radius:4px;cursor:pointer}.note{font-size:12px;color:#626962}#status{color:#17633d}</style></head><body>
<h1>闲书书采购地址助手</h1><p>采购填址、商品收图、待付款提示回传。</p>
<button id="open">打开本地订单</button><p class="note">独立安装；提交采购和付款由你操作。</p>
<label for="site">可选：你的闲书书服务器网址</label><input id="site" placeholder="https://你的域名" type="url"><button id="save">连接此网站</button>
<p class="note">本地版默认支持 127.0.0.1:5000 和 localhost:5000。连接服务器时，浏览器会请求仅该网站的访问权限。</p><p id="status" role="status"></p><p class="note">地址仅在本次浏览器会话内缓存 10 分钟；不读取密码、Cookie，不上传到第三方服务。版本 1.1.0</p>
<script src="popup.js"></script></body></html>
